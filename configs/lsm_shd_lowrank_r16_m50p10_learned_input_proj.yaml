base: lsm_shd_baseline.yaml

# learned_lowrank r16 + validation rollback m50p10
# with trainable sparse input projection.

experiment_name: lsm_shd_lowrank_r16_m50p10_learned_input_proj

use_validation: true
val_fraction: 0.1
val_seed: 42

liquid:
  recurrent_mode: learned_lowrank
  recurrent_sparsity: 0.1

  theta_rank: 16
  theta_lowrank_init_std: 0.30
  theta_init_mean: -1.0
  theta_init_std: 0.5
  theta_lr_scale: 0.3

  train_w_raw: false
  w_raw_init_mean: -2.25
  w_raw_init_std: 0.01
  w_raw_max: -2.0

  theta_warmup_epochs: 10
  theta_warmup_dynamic: false
  theta_freeze_epoch: 0
  theta_adaptive_freeze: false

  topology_adaptive_freeze: true
  topology_freeze_metric: val_acc
  topology_freeze_min_epoch: 50
  topology_freeze_patience: 10
  topology_freeze_min_delta: 0.0
  topology_freeze_rollback_best: true
  topology_freeze_verbose: true

  input_projection_mode: learned_sparse
  train_input_projection: true
  input_proj_lr_scale: 0.3
  input_proj_grad_clip: 10.0
