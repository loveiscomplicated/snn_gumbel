base: lsm_shd_C_valrollback_m50p10.yaml

experiment_name: lsm_shd_lif_lowrank_readout_membrane_trace

liquid:
  recurrent_mode: learned_lowrank
  neuron_type: lif
  readout_mode: membrane_trace

  # Match the strong LIF lowrank baseline used in the seed-42..45 comparison.
  theta_init_mean: -1.0
  theta_lowrank_init_std: 0.30
  theta_warmup_epochs: 10
  theta_lr_scale: 0.3
  theta_lr_ramp_epochs: 1
  theta_bias_lr_scale: 1.0
  noise_scale: 0.1
  topology_freeze_min_epoch: 50
  topology_freeze_patience: 10
