base: lsm_shd_C_valrollback_m50p10.yaml

experiment_name: lsm_shd_alif_lowrank_lifmatched_a025_b010

liquid:
  recurrent_mode: learned_lowrank
  neuron_type: alif

  # Match the strong LIF lowrank setting; only the neuron dynamics differ.
  theta_init_mean: -1.0
  theta_lowrank_init_std: 0.30
  theta_warmup_epochs: 10
  theta_lr_scale: 0.3
  theta_lr_ramp_epochs: 1
  theta_bias_lr_scale: 1.0
  noise_scale: 0.1
  topology_freeze_min_epoch: 50
  topology_freeze_patience: 10

  # Middle ALIF adaptation sweep point.
  alif_rho_init: 0.85
  alif_beta_init: 0.10
  alif_adapt_increment: 0.25
  alif_learn_rho: false
  alif_learn_beta: false
