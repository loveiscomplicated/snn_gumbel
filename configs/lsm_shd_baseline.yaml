base: base.yaml

experiment_name: lsm_shd
dataset: shd

n_input: 700
n_output: 20
T: 100
beta: 0.9

architecture:
  hidden_layers: []

liquid:
  n_liquid: 500
  exc_ratio: 0.8
  p_input: 0.1
  recurrent_mode: learned
  recurrent_sparsity: 0.1
  self_connection: false
  theta_init_mean: -2.2
  theta_init_std: 0.5
  w_raw_init_mean: -4.0
  w_raw_init_std: 0.01
  train_w_raw: true
  w_raw_max: -3.0
  bptt_truncate: 25
  grad_clip_max_norm_w: 100.0
  grad_clip_max_norm_theta: 10.0
  theta_warmup_epochs: 10
  theta_warmup_dynamic: false
  theta_warmup_strategy: slope
  theta_warmup_window: 3
  theta_warmup_min_epochs: 5
  theta_warmup_patience: 3
  theta_warmup_min_delta: 0.002
  theta_warmup_metric: test_acc
  theta_lr_scale: 0.3
  theta_freeze_epoch: 0
  theta_adaptive_freeze: false
  theta_freeze_min_epoch: 20
  theta_freeze_grad_threshold: 30.0
  theta_freeze_patience: 2
  noise_scale: 0.1
  input_weight_scale: 0.3
  beta_min: 0.7
  beta_max: 0.95
  threshold_min: 0.8
  threshold_max: 1.5

tau_start: 1.0
tau_end: 0.05
tau_anneal_epochs: 40
tau_hold_epochs: 15

epochs: 100
patience: 40
batch_size: 64
lr: 0.001
lr_min: 0.00001
weight_decay: 0.0001
lambda_sparse: 0.1
lambda_commit: 0.01
seed: 42
