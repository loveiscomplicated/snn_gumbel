base: lsm_shd_lowrank_r16_m50p10_learned_input_proj.yaml

# learned_lowrank r16 + validation rollback m50p10
# + learned_sparse input projection
# + FDI-style initial firing-regime calibration.

experiment_name: lsm_shd_lowrank_r16_m50p10_learned_input_proj_fdi

liquid:
  input_projection_mode: learned_sparse
  train_input_projection: true
  input_proj_lr_scale: 0.3
  input_proj_grad_clip: 10.0

  init_mode: fdi_calibrated

  fdi_probe_batches: 8

  fdi_target_rate_hz: 10.0
  fdi_target_rate_hz_min: 5.0
  fdi_target_rate_hz_max: 20.0

  fdi_max_silent_frac: 0.35
  fdi_silent_rate_hz: 1.0

  fdi_max_overactive_frac: 0.05
  fdi_overactive_rate_hz: 50.0

  fdi_target_xi_min: 1.0
  fdi_target_xi_max: 3.0

  fdi_max_adapt_ratio: 0.35

  fdi_recurrent_to_input_ratio_min: 0.3
  fdi_recurrent_to_input_ratio_max: 1.5

  fdi_candidate_input_scales: [0.75, 1.0, 1.25, 1.5]
  fdi_candidate_recurrent_scales: [0.75, 1.0]
  fdi_candidate_threshold_scales: [0.75, 1.0, 1.25, 1.5]

  fdi_strict_mode: false
